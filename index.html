<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sonia & David · Nuestra Boda</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #c9a84c;
      --gold-light: #e8d5a3;
      --gold-dark: #8b6914;
      --cream: #f8f3e8;
      --cream-dark: #ede5d0;
      --stone: #6b5d4f;
      --ink: #2c2416;
      --white: #fffdf7;
    }

    body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      background-color: var(--cream);
      color: var(--ink);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* — Background texture — */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(201,168,76,0.08) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(139,105,20,0.06) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* — Hero — */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem 4rem;
      z-index: 1;
    }

    /* Decorative top border */
    .hero::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, transparent, var(--gold), var(--gold-light), var(--gold), transparent);
    }

    /* Ornamental divider */
    .ornament {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 0.2em;
      margin: 1.2rem 0;
    }
    .ornament::before,
    .ornament::after {
      content: '';
      flex: 1;
      height: 1px;
      max-width: 80px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .ornament::after {
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .tag {
      font-family: 'Cinzel', serif;
      font-size: 0.7rem;
      letter-spacing: 0.35em;
      color: var(--gold-dark);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 600;
      color: var(--ink);
      letter-spacing: 0.05em;
      text-align: center;
      line-height: 1.15;
    }

    h1 span {
      color: var(--gold-dark);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.1rem, 3vw, 1.4rem);
      color: var(--stone);
      text-align: center;
      margin-top: 0.5rem;
      font-weight: 300;
    }

    /* — Upload card — */
    .card {
      background: var(--white);
      border: 1px solid var(--gold-light);
      border-radius: 2px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      margin-top: 2.5rem;
      position: relative;
      box-shadow: 0 8px 40px rgba(139,105,20,0.1), 0 2px 8px rgba(139,105,20,0.05);
    }

    /* Corner ornaments */
    .card::before, .card::after {
      content: '✦';
      position: absolute;
      color: var(--gold);
      font-size: 0.9rem;
      line-height: 1;
    }
    .card::before { top: 10px; left: 14px; }
    .card::after  { bottom: 10px; right: 14px; }

    .card-title {
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      color: var(--gold-dark);
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
    }

    /* File drop zone */
    .drop-zone {
      border: 1.5px dashed var(--gold-light);
      border-radius: 2px;
      padding: 2rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      background: var(--cream);
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--gold);
      background: rgba(201,168,76,0.05);
    }

    .drop-zone input[type=file] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.2rem;
      margin-bottom: 0.6rem;
      display: block;
    }

    .drop-text {
      font-size: 1rem;
      color: var(--stone);
      font-style: italic;
    }

    .drop-hint {
      font-size: 0.8rem;
      color: var(--gold-dark);
      margin-top: 0.3rem;
      letter-spacing: 0.05em;
    }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 1.2rem;
      text-align: center;
    }
    #preview-wrap img {
      max-width: 100%;
      max-height: 180px;
      border-radius: 2px;
      border: 1px solid var(--gold-light);
      object-fit: cover;
    }
    #preview-name {
      font-size: 0.8rem;
      color: var(--stone);
      margin-top: 0.4rem;
      font-style: italic;
    }

    /* Button */
    .btn {
      display: block;
      width: 100%;
      margin-top: 1.5rem;
      padding: 0.9rem 1rem;
      background: var(--gold-dark);
      color: var(--cream);
      border: none;
      border-radius: 1px;
      font-family: 'Cinzel', serif;
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover  { background: var(--gold); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { background: var(--gold-light); cursor: not-allowed; color: var(--stone); }

    /* Status */
    #status {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 1rem;
      min-height: 1.4rem;
      font-style: italic;
      color: var(--stone);
      transition: color 0.3s;
    }
    #status.ok  { color: #4a7c59; }
    #status.err { color: #993c1d; }

    /* Progress bar */
    .progress-wrap {
      margin-top: 0.8rem;
      height: 2px;
      background: var(--cream-dark);
      border-radius: 1px;
      overflow: hidden;
      display: none;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--gold);
      transition: width 0.3s ease;
    }

    /* Counter */
    #counter {
      margin-top: 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--gold-dark);
      letter-spacing: 0.1em;
    }

    /* Footer */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem 1rem 3rem;
      font-size: 0.8rem;
      color: var(--gold-dark);
      letter-spacing: 0.1em;
      font-family: 'Cinzel', serif;
    }
    footer::before {
      content: '';
      display: block;
      width: 60px;
      height: 1px;
      background: var(--gold-light);
      margin: 0 auto 1.2rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 2rem 1.2rem; margin-top: 2rem; }
    }
  </style>
</head>
<body>

  <section class="hero">
    <p class="tag">Comparte el amor</p>
    <h1>Sonia <span>&</span> David</h1>
    <p class="subtitle">Nuestra Boda · Los mejores recuerdos se comparten</p>

    <div class="ornament">✦</div>

    <div class="card">
      <p class="card-title">Sube tu foto de la boda</p>

      <div class="drop-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*,video/mp4,video/quicktime,video/webm">
        <span class="drop-icon">📸</span>
        <p class="drop-text">Toca para elegir una foto o video corto</p>
        <p class="drop-hint">Foto (hasta 30 MB) · Video corto (hasta 100 MB)</p>
      </div>

      <div id="preview-wrap">
        <img id="preview-img" src="" alt="Vista previa">
        <video id="preview-video" controls style="display:none; max-width:100%; max-height:180px; border-radius:2px; border:1px solid var(--gold-light);"></video>
        <p id="preview-name"></p>
      </div>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <button class="btn" id="uploadBtn" onclick="uploadPhoto()" disabled>
        Compartir recuerdo
      </button>

      <div id="status"></div>
    </div>

    <div id="counter"></div>
  </section>

  <footer>
    Sonia &amp; David · 2026 · Con amor
  </footer>

  <script>
    const UPLOAD_CODE = '8bTXZGJdEwkqetxSjJP7HKTpR9SLOBBX7';
    const MAX_VIDEO  = 100 * 1024 * 1024;  // 100 MB límite video
    const MAX_PHOTO  = 30  * 1024 * 1024;  // 30 MB límite foto

    const fileInput   = document.getElementById('fileInput');
    const uploadBtn   = document.getElementById('uploadBtn');
    const statusEl    = document.getElementById('status');
    const previewWrap = document.getElementById('preview-wrap');
    const previewImg  = document.getElementById('preview-img');
    const previewVideo= document.getElementById('preview-video');
    const previewName = document.getElementById('preview-name');
    const progressWrap= document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const counterEl   = document.getElementById('counter');

    let uploadCount = parseInt(localStorage.getItem('boda_uploads') || '0');
    if (uploadCount > 0) counterEl.textContent = `Has compartido ${uploadCount} archivo${uploadCount > 1 ? 's' : ''} 💛`;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      const isPhoto = file.type.startsWith('image/');
      const limit   = isVideo ? MAX_VIDEO : MAX_PHOTO;
      const limitMB = isVideo ? '100 MB' : '30 MB';

      if (file.size > limit) {
        setStatus(`⚠ El archivo supera el límite de ${limitMB}. Elige uno más corto.`, 'err');
        fileInput.value = '';
        return;
      }

      const url = URL.createObjectURL(file);
      if (isVideo) {
        previewImg.style.display   = 'none';
        previewVideo.style.display = 'block';
        previewVideo.src = url;
      } else {
        previewVideo.style.display = 'none';
        previewImg.style.display   = 'block';
        previewImg.src = url;
      }
      previewName.textContent = `${file.name} · ${(file.size / 1024 / 1024).toFixed(1)} MB`;
      previewWrap.style.display = 'block';
      uploadBtn.disabled = false;
      setStatus('');
    });

    // Drag & drop
    const zone = document.getElementById('dropZone');
    zone.addEventListener('dragover',  e => { e.preventDefault(); zone.classList.add('drag-over'); });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file && (file.type.startsWith('image/') || file.type.startsWith('video/'))) {
        const dt = new DataTransfer();
        dt.items.add(file);
        fileInput.files = dt.files;
        fileInput.dispatchEvent(new Event('change'));
      }
    });

    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className   = type;
    }

    async function uploadPhoto() {
      const file = fileInput.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      uploadBtn.disabled = true;
      setStatus(isVideo ? 'Subiendo tu video… puede tardar unos segundos ⏳' : 'Subiendo tu recuerdo…');
      progressWrap.style.display = 'block';
      progressBar.style.width = '15%';

      const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
      const prefix    = isVideo ? 'video' : 'foto';
      const safeName  = `boda_${prefix}_${timestamp}_${file.name.replace(/\s+/g, '_')}`;

      const form = new FormData();
      form.append('file', new File([file], safeName, { type: file.type }));
      form.append('code', UPLOAD_CODE);

      try {
        progressBar.style.width = '50%';

        // pCloud tiene dos servidores: api.pcloud.com (US) y eapi.pcloud.com (Europa)
        // Tu cuenta es europea (Made in Europe) así que usamos eapi
        let res = await fetch('https://eapi.pcloud.com/uploadtolink', { method: 'POST', body: form });
        progressBar.style.width = '90%';
        let data = await res.json();

        // Si falla con eapi, intentamos con api.pcloud.com
        if (data.result !== 0) {
          const form2 = new FormData();
          form2.append('file', new File([file], safeName, { type: file.type }));
          form2.append('code', UPLOAD_CODE);
          res  = await fetch('https://api.pcloud.com/uploadtolink', { method: 'POST', body: form2 });
          data = await res.json();
        }

        progressBar.style.width = '100%';

        if (data.result === 0) {
          setStatus('✦ ¡Gracias por compartir este momento! ✦', 'ok');
          uploadCount++;
          localStorage.setItem('boda_uploads', uploadCount);
          counterEl.textContent = `Has compartido ${uploadCount} archivo${uploadCount > 1 ? 's' : ''} 💛`;
          setTimeout(() => {
            fileInput.value = '';
            previewWrap.style.display  = 'none';
            progressWrap.style.display = 'none';
            progressBar.style.width    = '0%';
            uploadBtn.disabled = true;
            setStatus('');
          }, 3000);
        } else {
          setStatus(`No se pudo subir el archivo. Error: ${data.result} - ${data.error || ''}`, 'err');
          uploadBtn.disabled = false;
          progressWrap.style.display = 'none';
        }
      } catch (e) {
        setStatus('Error de conexión. Verifica tu red.', 'err');
        uploadBtn.disabled = false;
        progressWrap.style.display = 'none';
      }
    }
  </script>
</body>
</html>
